services:

  frontend: 
    image: ${DOCKERHUB_USERNAME}/devboard_frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports: 
      - "8000:8000"
    depends_on: 
      - backend
       
  backend: 
    image: ${DOCKERHUB_USERNAME}/devboard_backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PORT: ${BACKEND_PORT}
    depends_on: 
      postgres: 
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  
