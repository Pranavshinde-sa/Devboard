apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devboard-backend-hpa
  namespace: devboard

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devboard-backend-deployment

  minReplicas: 1
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15

    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
