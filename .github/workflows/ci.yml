name: CI

on:

  workflow_dispatch:
  
  workflow_call:


jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run linting
        run: npm run lint
        working-directory: frontend

      - name: Run tests
        run: npm run test
        working-directory: frontend

      - name: Build application
        run: npm run build
        working-directory: frontend

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/devboard_frontend:latest
            ${{ vars.DOCKERHUB_USERNAME }}/devboard_frontend:${{ github.sha }}
  
  backend: 
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup go
        uses: actions/setup-go@v4
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run formatter
        run: go fmt ./...
        working-directory: backend
        
      - name: Run vet
        run: go vet ./...
        working-directory: backend

      - name: Run test
        run: go test ./...
        working-directory: backend
      
      - name: Build applications
        run: go build ./...
        working-directory: backend

      - name: Login to docker 
        uses: docker/login-action@v3
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Build and push code 
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/devboard_backend:latest
            ${{ vars.DOCKERHUB_USERNAME }}/devboard_backend:${{ github.sha }}