name: Secret Scanning

on: 
    workflow_call:
    workflow_dispatch:

jobs:
    Secret-scanning:
        runs-on: ubuntu-latest

        steps:
            - name: Code Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Secret Scanning
              uses: gitleaks/gitleaks-action@v3

              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                config: .gitleaks.toml

              
