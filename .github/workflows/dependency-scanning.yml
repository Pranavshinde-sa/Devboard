name: Dependency Scanning

on:
    workflow_call:
    workflow_dispatch:

jobs:
    dependency-scanning:
        runs-on: ubuntu-latest

        steps:
            - name: Code Checkout 
              uses: actions/checkout@v4

            - name: Trivy Dependecy Scan
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                scan-type: fs
                scan-ref: .
                scanners: vuln
                format: table
                severity: HIGH,CRITICAL
                ignore-unfixed: true
                exit-code: 1