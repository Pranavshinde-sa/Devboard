name: Code Quality 

on:
    workflow_call:
    workflow_dispatch:

jobs:
    frontend:
        runs-on: ubuntu-latest
        
        steps:
            - name: Code Checkout
              uses: actions/checkout@v4

            - name: Setup node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'
                cache: npm
                cache-dependency-path: frontend/package-lock.json
                
            - name: Install Dependencies
              run: npm ci
              working-directory: frontend

            - name: Code linting 
              run: npm run lint
              working-directory: frontend

    backend:
      runs-on: ubuntu-latest

      steps:
            - name: Code Checkout
              uses: actions/checkout@v4

            - name: Setup go
              uses: actions/setup-go@v4
              with:
                go-version-file: backend/go.sum
                cache: true
                cache-dependency-path: backend/go.mod

            - name: Run go formatter
              run: go fmt ./...
              working-directory: backend

            - name: Run go vet
              run: go vet ./...
              working-directory: backend

            
